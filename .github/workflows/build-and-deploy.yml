name: Build and Deploy News Site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [news-update]
  workflow_dispatch:
    inputs:
      PUBLIC_BACKEND_URL:
        description: 'Public backend API URL to fetch news (optional if stored in secrets)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine PUBLIC_BACKEND_URL
        run: |
          echo "Determining PUBLIC_BACKEND_URL"
          # Priority: dispatch payload -> workflow input -> repository secret -> .env
          if [ -n "${{ github.event.client_payload.PUBLIC_BACKEND_URL }}" ]; then
            echo "PUBLIC_BACKEND_URL=${{ github.event.client_payload.PUBLIC_BACKEND_URL }}" >> $GITHUB_ENV
            echo "BACKEND_URL=${{ github.event.client_payload.PUBLIC_BACKEND_URL }}" >> $GITHUB_ENV
            echo "PUBLIC_BACKEND_URL_SOURCE=dispatch_payload" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.PUBLIC_BACKEND_URL }}" ]; then
            echo "PUBLIC_BACKEND_URL=${{ github.event.inputs.PUBLIC_BACKEND_URL }}" >> $GITHUB_ENV
            echo "BACKEND_URL=${{ github.event.inputs.PUBLIC_BACKEND_URL }}" >> $GITHUB_ENV
            echo "PUBLIC_BACKEND_URL_SOURCE=workflow_input" >> $GITHUB_ENV
          elif [ -n "${{ secrets.PUBLIC_BACKEND_URL }}" ]; then
            # Use secret (preferred over .env). Do NOT print the secret value.
            echo "PUBLIC_BACKEND_URL=${{ secrets.PUBLIC_BACKEND_URL }}" >> $GITHUB_ENV
            echo "BACKEND_URL=${{ secrets.PUBLIC_BACKEND_URL }}" >> $GITHUB_ENV
            echo "PUBLIC_BACKEND_URL_SOURCE=repo_secret" >> $GITHUB_ENV
          elif [ -f .env ]; then
            value=$(grep '^PUBLIC_BACKEND_URL' .env | head -n1 | cut -d= -f2- | tr -d '"')
            if [ -n "$value" ]; then
              echo "PUBLIC_BACKEND_URL=$value" >> $GITHUB_ENV
              echo "BACKEND_URL=$value" >> $GITHUB_ENV
              echo "PUBLIC_BACKEND_URL_SOURCE=repo_env_file" >> $GITHUB_ENV
            fi
          else
            echo "PUBLIC_BACKEND_URL_SOURCE=not_set" >> $GITHUB_ENV
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch content from backend
        run: |
          if [ -z "$PUBLIC_BACKEND_URL" ]; then
            echo "No PUBLIC_BACKEND_URL provided"
            exit 1
          fi
          npm run fetch

      - name: Build site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
